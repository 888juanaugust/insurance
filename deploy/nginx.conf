# /etc/nginx/sites-available/insurhelp — symlink into sites-enabled.
# Certbot rewrites this to add the TLS block and the port-80 redirect.

server {
    listen 80;
    server_name insurhelp.example.com;

    # Policy PDFs are a few MB; the default 1m rejects them at the proxy
    # before the app ever sees the upload.
    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;   # reading a large PDF can take a while
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
