# /etc/nginx/sites-available/insurhelp — symlink into sites-enabled.
#
# Port 80 only, and deliberately no TLS block. `listen 443 ssl` without a
# certificate is a fatal error, not a warning, so a config that ships the HTTPS
# half up front fails `nginx -t` before certbot has had any chance to run — and
# certbot --nginx cannot run against a config that will not parse. That is a
# deadlock, so the certificate half is certbot's to write.
#
# Once the name resolves to this server:
#
#     certbot --nginx -d insurhelp.example.com
#
# (or, without that plugin, `mkdir -p /var/www/certbot` then
#  `certbot certonly --webroot -w /var/www/certbot -d insurhelp.example.com`,
#  which the acme-challenge location below is there to serve)
#
# rewrites the block below to listen on 443 with the certificate in place, adds
# a second block on 80 that redirects to it, and keeps both at renewal. Nothing
# here needs editing afterwards except the server_name.

server {
    listen 80;
    listen [::]:80;
    server_name insurhelp.example.com;

    # Policy PDFs are a few MB; the default 1m rejects them at the proxy
    # before the app ever sees the upload.
    client_max_body_size 20m;

    # Certbot's HTTP-01 challenge, before the proxy below claims it. Without
    # this, `certbot --webroot` hands the challenge to the application, which
    # knows nothing about it, and the certificate is refused. The nginx plugin
    # does not need this; the fallback when that plugin is unavailable does.
    # `^~` so it wins over the `location /` prefix match.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # $http_host, not $host: Next checks a form submission's Origin against
        # the Host it received, and $host drops the port. On 443 they are the
        # same; on any other port $host would make every sign-in "Invalid
        # Server Actions request".
        proxy_set_header   Host              $http_host;
        # The application reads the caller's address from X-Real-IP for the
        # sign-in throttle. Do not remove this line.
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # reading a large PDF can take a while
    }

    # Next fingerprints these filenames, so they can be cached hard. No
    # proxy_cache zone is defined, so this is the browser's cache, not nginx's.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
