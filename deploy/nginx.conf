# /etc/nginx/sites-available/insurhelp — symlink into sites-enabled.
#
# Port 80 does one thing: send everyone to HTTPS. The application's cookies
# are marked Secure, so a browser will not send them over plain HTTP anyway,
# but nothing should be served there at all. Run certbot to fill in the TLS
# block below (`certbot --nginx -d insurhelp.example.com`); it keeps the
# redirect.

server {
    listen 80;
    listen [::]:80;
    server_name insurhelp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name insurhelp.example.com;

    # Filled in by certbot:
    # ssl_certificate     /etc/letsencrypt/live/insurhelp.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/insurhelp.example.com/privkey.pem;

    # Policy PDFs are a few MB; the default 1m rejects them at the proxy
    # before the app ever sees the upload.
    client_max_body_size 20m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;   # reading a large PDF can take a while
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
